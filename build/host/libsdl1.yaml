
- name: host-libsdl1-raspi2b_r1-arm-hosted
  source: sdl1@1.2.15
  dependency:
    - host-binutils-raspi2b_r1-arm-hosted
    - host-gcc-final-raspi2b_r1-arm-hosted
    - host-newlib-static-raspi2b_r1-arm-hosted
    - host-pkg-config-raspi2b_r1-arm
    - tmp-autoconf-libsdl1-2.59
  path:
    - '{PREFIX}/bin'
    - '{PREFIX}/../build/tmp/libsdl1-build/bin'
  configure:
    - folder: '{SOURCE_DIR}'
      command: sh autogen.sh
  prepare:
    - '{SOURCE_DIR}/configure --prefix={SYSROOT}/arm-raspi2b_r1-bolthur-eabi/usr --host=arm-raspi2b_r1-bolthur-eabi'
  build:
    - 'make all -j{CPU_COUNT}'
  install:
    - 'make install'

