
- name: host-bfs-raspi2b_r1-arm-hosted
  source: bfs@0.1.0
  dependency:
    - host-binutils-raspi2b_r1-arm-hosted
    - host-gcc-final-raspi2b_r1-arm-hosted
    - host-newlib-static-raspi2b_r1-arm-hosted
    - host-pkg-config-raspi2b_r1-arm
  prepare:
    - 'cmake -G"Unix Makefiles" -DSYSTEM_TYPE=bolthur -DCMAKE_INSTALL_PREFIX={SYSROOT}/arm-raspi2b_r1-bolthur-eabi/usr -DBFS_BUILD_SHARED_LIB=0 -DCMAKE_TOOLCHAIN_FILE={SOURCE_DIR}/toolchain/arm-raspi2b_r1-bolthur-eabi.cmake {SOURCE_DIR}'
  build:
    - 'make all -j{CPU_COUNT}'
  install:
    - 'make install -j{CPU_COUNT}'

