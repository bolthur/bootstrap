
- name: host-freetype-raspi2b_r1-arm-hosted
  source: freetype@2.14.3
  dependency:
    - host-binutils-raspi2b_r1-arm-hosted
    - host-gcc-final-raspi2b_r1-arm-hosted
    - host-newlib-static-raspi2b_r1-arm-hosted
    - host-libpng-raspi2b_r1-arm-hosted
    - host-zlib-raspi2b_r1-arm-hosted
  configure:
    - folder: '{SOURCE_DIR}/builds/unix'
      command: 'aclocal -I . --force'
    - folder: '{SOURCE_DIR}/builds/unix'
      command: 'libtoolize --force --copy --install'
    - folder: '{SOURCE_DIR}/builds/unix'
      command: 'autoconf --force'
  prepare:
    - '{SOURCE_DIR}/configure --host=arm-raspi2b_r1-bolthur-eabi --prefix={SYSROOT}/arm-raspi2b_r1-bolthur-eabi/usr --without-bzip2 --without-harfbuzz --without-brotli'
  build:
    - 'make -j{CPU_COUNT}'
  install:
    - 'make install'

