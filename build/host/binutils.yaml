
- name: host-binutils-raspi2b_r1-arm-hosted
  source: binutils@2.46.0
  dependency:
    - tmp-autoconf-binutils-2.69
    - tmp-automake-binutils-1.15.1
  path:
    - '{PREFIX}/bin'
    - '{PREFIX}/../build/tmp/binutils-build/bin'
  configure:
    - folder: '{SOURCE_DIR}/ld'
      command: automake
  prepare:
    - '{SOURCE_DIR}/configure --target=arm-raspi2b_r1-bolthur-eabi --prefix={PREFIX} --disable-nls --disable-werror --disable-libssp --with-sysroot={SYSROOT}/arm-raspi2b_r1-bolthur-eabi --with-pkgversion="GNU Binutils; bolthur raspi2b_r1 bootstrap cross" --enable-shared'
  build:
    - 'make -j{CPU_COUNT}'
  install:
    - 'make install-strip'

