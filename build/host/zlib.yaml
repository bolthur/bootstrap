
- name: host-zlib-raspi2b_r1-arm-hosted
  source: zlib@1.3.2
  dependency:
    - host-binutils-raspi2b_r1-arm-hosted
    - host-gcc-final-raspi2b_r1-arm-hosted
    - host-newlib-static-raspi2b_r1-arm-hosted
    - host-pkg-config-raspi2b_r1-arm
  env:
    - name: 'CHOST'
      value: 'arm-raspi2b_r1-bolthur-eabi'
  prepare:
    - '{SOURCE_DIR}/configure --prefix={SYSROOT}/arm-raspi2b_r1-bolthur-eabi/usr'
  build:
    - 'make -j{CPU_COUNT}'
  install:
    - 'make install'

- name: host-zlib-raspi0_1-arm-hosted
