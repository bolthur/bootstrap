    - host-newlib-static-raspi0_1-arm-hosted
    - host-pkg-config-raspi0_1-arm
  env:
    - name: 'CHOST'
      value: 'arm-raspi0_1-bolthur-eabi'
  prepare:
    - '{SOURCE_DIR}/configure --prefix={SYSROOT}/arm-raspi0_1-bolthur-eabi/usr'
  build:
    - 'make -j{CPU_COUNT}'
  install:
    - 'make install'
