
- name: host-libconfini-raspi2b_r1-arm-hosted
  source: libconfini@1.16.4
  dependency:
    - host-binutils-raspi2b_r1-arm-hosted
    - host-gcc-final-raspi2b_r1-arm-hosted
    - host-newlib-static-raspi2b_r1-arm-hosted
    - host-pkg-config-raspi2b_r1-arm
  configure:
    - folder: '{SOURCE_DIR}'
      command: 'libtoolize'
    - folder: '{SOURCE_DIR}'
      command: 'aclocal'
    - folder: '{SOURCE_DIR}'
      command: 'automake --add-missing --copy --gnu'
    - folder: '{SOURCE_DIR}'
      command: 'autoconf'
  prepare:
    - '{SOURCE_DIR}/configure --host=arm-raspi2b_r1-bolthur-eabi --prefix={SYSROOT}/arm-raspi2b_r1-bolthur-eabi/usr'
  build:
    - 'make -j{CPU_COUNT}'
  install:
    - 'make install'

