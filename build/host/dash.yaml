
- name: host-dash-raspi2b_r1-arm-hosted
  source: dash@0.5.13.4
  dependency:
    - host-binutils-raspi2b_r1-arm-hosted
    - host-gcc-final-raspi2b_r1-arm-hosted
    - host-newlib-static-raspi2b_r1-arm-hosted
    - host-libpng-raspi2b_r1-arm-hosted
    - host-zlib-raspi2b_r1-arm-hosted
  configure:
    - folder: '{SOURCE_DIR}'
      command: 'autoreconf -ivf'
  prepare:
    - 'CFLAGS="-DJOBS=0" {SOURCE_DIR}/configure --host=arm-raspi2b_r1-bolthur-eabi --prefix={SYSROOT}/arm-raspi2b_r1-bolthur-eabi/usr --enable-static'
  build:
    - 'make -j{CPU_COUNT}'
  install:
    - 'make install'

