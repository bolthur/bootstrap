
- name: host-gcc-stage1-raspi2b_r1-arm-hosted
  source: gcc@16.1.0
  dependency:
    - tmp-autoconf-gcc-2.69
    - tmp-automake-gcc-1.15.1
    - host-patch
    - host-binutils-raspi2b_r1-arm-hosted
    - host-newlib-header-arm-raspi2b_r1-hosted
  path:
    - '{PREFIX}/bin'
    - '{PREFIX}/../build/tmp/gcc-build/bin'
  configure:
    - folder: '{SOURCE_DIR}/libstdc++-v3'
      command: autoconf
    - folder: '{SOURCE_DIR}/gcc'
      command: autoconf
    - folder: '{SOURCE_DIR}'
      command: './contrib/download_prerequisites'
  prepare:
    - '{SOURCE_DIR}/configure --target=arm-raspi2b_r1-bolthur-eabi --prefix={PREFIX} --disable-nls --enable-languages=c,c++ --disable-werror --disable-libssp --with-newlib --with-sysroot={SYSROOT}/arm-raspi2b_r1-bolthur-eabi --with-toolexeclibdir={SYSROOT}/arm-raspi2b_r1-bolthur-eabi/usr/lib --with-pkgversion="GCC; bolthur bootstrap cross" --enable-shared --with-arch=armv7-a --with-tune=cortex-a7 --with-fpu=neon-vfpv4 --with-float=hard --disable-multilib --enable-libsanitizer'
  build:
    - 'make all-gcc -j{CPU_COUNT}'
    - 'make all-target-libgcc -j{CPU_COUNT}'
  install:
    - 'make install-strip-gcc -j{CPU_COUNT}'
    - 'make install-strip-target-libgcc -j{CPU_COUNT}'

