
- name: host-dtc
  dependency:
    - host-libyaml
  source: dtc@1.8.1
  install:
    - 'make clean -C "{SOURCE_DIR}"'
    - 'make install SETUP_PREFIX="{PREFIX}" PREFIX="{PREFIX}" NO_PYTHON=1 -C "{SOURCE_DIR}"'

- name: host-dtc-raspi2b_r1-arm
  dependency:
    - host-binutils-raspi2b_r1-arm-hosted
    - host-gcc-final-raspi2b_r1-arm-hosted
    - host-newlib-static-raspi2b_r1-arm-hosted
    - host-libyaml-raspi2b_r1-arm-hosted
  source: dtc@1.8.1
  install:
    - 'make clean -C "{SOURCE_DIR}"'
    - 'make install AR=arm-raspi2b_r1-bolthur-eabi-ar CC=arm-raspi2b_r1-bolthur-eabi-gcc SETUP_PREFIX="{PREFIX}" PREFIX={SYSROOT}/arm-raspi2b_r1-bolthur-eabi/usr NO_PYTHON=1 NO_VALGRIND=1 -C "{SOURCE_DIR}"'

- name: host-dtc-raspi0_1-arm
  dependency:
    - host-binutils-raspi0_1-arm-hosted
    - host-gcc-final-raspi0_1-arm-hosted
    - host-newlib-static-raspi0_1-arm-hosted
    - host-libyaml-raspi0_1-arm-hosted
  source: dtc@1.8.1
  install:
    - 'make clean -C "{SOURCE_DIR}"'
    - 'make install AR=arm-raspi0_1-bolthur-eabi-ar CC=arm-raspi0_1-bolthur-eabi-gcc SETUP_PREFIX="{PREFIX}" PREFIX={SYSROOT}/arm-raspi0_1-bolthur-eabi/usr NO_PYTHON=1 NO_VALGRIND=1 -C "{SOURCE_DIR}"'
