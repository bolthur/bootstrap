
- name: host-nim
  source: nim@2.2.10
  dependency:
    - host-patch
    - host-binutils-raspi2b_r1-arm-hosted
    - host-gcc-final-raspi2b_r1-arm-hosted
    - host-newlib-static-raspi2b_r1-arm-hosted
    - host-binutils-raspi0_1-arm-hosted
    - host-gcc-final-raspi0_1-arm-hosted
    - host-newlib-static-raspi0_1-arm-hosted
  install:
    - 'rm -rf {PREFIX}/nim'
    - 'cp -r {SOURCE_DIR} {PREFIX}/nim'
    - 'cd {PREFIX}/nim && sh build.sh'
    - 'cd {PREFIX}/nim && bin/nim c koch'
    - 'cd {PREFIX}/nim && ./koch boot -d:release'
    - 'cd {PREFIX}/nim && ./koch tools -d:release'
    - 'cd {PREFIX}/nim && ./koch nimble -d:release'
